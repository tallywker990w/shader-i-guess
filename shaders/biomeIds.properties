# Biome ids used by the aurora. Format: biome.<id>=<namespace:biome_name>
# ids 1000-1013 are the default aurora biomes (snowy + taiga), toggled one by one in
#   Shader Options > Aurora > Aurora Biomes.
# ids 9001-9004 are CUSTOM SLOTS: change the biome name on the right to any biome you like
#   (modded biomes work too, e.g. biome.9001=mymod:crystal_forest), save, reload shaders,
#   then switch the matching "Custom slot" ON in Aurora Biomes.
biome.1000=minecraft:snowy_plains
biome.1001=minecraft:ice_spikes
biome.1002=minecraft:snowy_taiga
biome.1003=minecraft:snowy_slopes
biome.1004=minecraft:grove
biome.1005=minecraft:frozen_peaks
biome.1006=minecraft:jagged_peaks
biome.1007=minecraft:taiga
biome.1008=minecraft:old_growth_pine_taiga
biome.1009=minecraft:old_growth_spruce_taiga
biome.1010=minecraft:snowy_beach
biome.1011=minecraft:frozen_river
biome.1012=minecraft:frozen_ocean
biome.1013=minecraft:deep_frozen_ocean
biome.9001=minecraft:meadow
biome.9002=minecraft:stony_peaks
biome.9003=minecraft:windswept_hills
biome.9004=minecraft:cherry_grove
